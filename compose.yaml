
services:
  bot:
    build: .
    container_name: price-watcher-bot
    command: python bot.py
    env_file:
      - .env
    environment:
      DB_PATH: /app/storage/price_watcher.db
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  parser:
    build: .
    profiles: ["parser"]
    command: python main.py
    environment:
      DB_PATH: /app/storage/price_watcher.db
    volumes:
      - ./storage:/app/storage
    restart: "no"
